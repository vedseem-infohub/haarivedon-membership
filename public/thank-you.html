<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <title>Thank You – HaarivedOn</title>
  <link rel="icon" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{padding:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(160deg,var(--green-900),var(--green-700));padding:20px}
    .ty{background:#fff;border-radius:22px;max-width:480px;width:100%;padding:36px 26px;text-align:center;border-top:6px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .ty img{margin:0 auto 14px}
    .ty h1{font-size:26px;margin:8px 0}
    .ty p{color:var(--muted);margin-bottom:22px}
  </style>
</head>
<body>
  <div class="ty">
    <img src="assets/logo.png" alt="HaarivedOn" width="72" height="72">
    <div class="modal-icon" id="icon">✓</div>
    <h1 id="title">Payment Successful!</h1>
    <p id="text">Our team will contact you on your registered mobile number within 24 hours.</p>
    <a href="/" class="btn btn-gold btn-block">Back to Home</a>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var product = q.get('product') === 'course' ? 'course' : 'membership';
      if (q.get('status') !== 'success') {
        document.getElementById('icon').textContent = '!';
        document.getElementById('icon').className = 'modal-icon error';
        document.getElementById('title').textContent = 'Payment not completed';
        document.getElementById('text').textContent = 'Your payment could not be completed. If money was debited, it will be auto-refunded by your bank, or our team will contact you. Please try again.';
        return;
      }
      document.getElementById('text').textContent = product === 'course'
        ? 'Your enrollment in the Draftsmanship – House/Property Layouting course is confirmed. Our team will contact you within 24 hours with your class schedule.'
        : 'Welcome to the Haarivedon 365-Day Membership! Our team will contact you on your registered mobile number within 24 hours with your webinar links.';
    })();
  </script>
</body>
</html>
